[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m2n2"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyreml",
    "torch",
    "numpy",
    "pandas",
    "patsy",
    "matplotlib",
]

authors = [
  {name = "Alexandre Marchal"},
  {name = "Daniele Raimondi"},
]
license = "GPL-3.0-or-later"
description = "Mixed effect neural networks: REML linear mixed model with a neural network embedding as random design."

[project.optional-dependencies]
test = [
    "pytest",
    "meiosim",
]

[tool.setuptools.dynamic]
version = {attr = "m2n2._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["m2n2*"]
